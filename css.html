<style>
  :root {
    --bg-dark: #090d16;
    --card-bg: rgba(18, 24, 38, 0.7);
    --card-border: rgba(255, 255, 255, 0.08);
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --primary: #00ffaa;
    --primary-glow: rgba(0, 255, 170, 0.2);
    --accent-cyan: #00e5ff;
    --accent-purple: #a855f7;
    --accent-danger: #ef4444;
    --accent-amber: #f59e0b;
    --border-color: rgba(255, 255, 255, 0.1);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Plus Jakarta Sans', sans-serif;
    min-height: 100vh;
    padding-bottom: 2rem;
    overflow-x: hidden;
  }

  header {
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
    padding: 0.9rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }

  .brand-icon {
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, #00ffaa 0%, #00b4d8 100%);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #000;
    font-weight: 800;
    font-size: 1.2rem;
    box-shadow: 0 0 15px var(--primary-glow);
    flex-shrink: 0;
  }

  .brand-text h1 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .brand-text p {
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .header-actions {
    display: flex;
    gap: 0.75rem;
    align-items: center;
  }

  .container {
    max-width: 1650px;
    width: 100%;
    margin: 0 auto;
    padding: 1.5rem;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1.25rem;
    margin-bottom: 1.5rem;
  }

  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(10px);
    border-radius: 14px;
    padding: 1.25rem;
    position: relative;
    overflow: hidden;
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 4px;
    height: 100%;
    background: var(--primary);
  }

  .stat-card.cyan::before { background: var(--accent-cyan); }
  .stat-card.danger::before { background: var(--accent-danger); }
  .stat-card.warn::before { background: var(--accent-amber); }

  .stat-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 0.5rem;
  }

  .stat-value {
    font-size: 1.6rem;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
  }

  .status-summary-bar {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding-bottom: 0.75rem;
    margin-bottom: 1.5rem;
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
  }

  .status-chip {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-color);
    padding: 0.45rem 0.85rem;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.75rem;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }

  .status-chip:hover {
    background: rgba(255, 255, 255, 0.08);
    transform: translateY(-1px);
  }

  .status-chip b {
    background: rgba(255, 255, 255, 0.15);
    padding: 0.15rem 0.45rem;
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
  }

  .chip-blue { border-color: rgba(59, 130, 246, 0.4); color: #93c5fd; }
  .chip-cyan { border-color: rgba(6, 182, 212, 0.4); color: #67e8f9; }
  .chip-purple { border-color: rgba(168, 85, 247, 0.4); color: #d8b4fe; }
  .chip-amber { border-color: rgba(245, 158, 11, 0.4); color: #fde68a; }
  .chip-success { border-color: rgba(16, 185, 129, 0.4); color: #6ee7b7; }
  .chip-danger { border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; }

  .table-controls {
    margin-bottom: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .filter-group-top {
    display: flex;
    gap: 0.75rem;
    align-items: center;
  }

  .filter-group-bottom {
    display: flex;
    gap: 0.75rem;
    align-items: center;
  }

  .search-input {
    flex: 2;
    min-width: 250px;
  }

  .select-jenis, .select-status {
    flex: 1;
    min-width: 180px;
  }

  .date-input-wrap {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .input-box {
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 0.6rem 0.9rem;
    border-radius: 8px;
    font-size: 0.85rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .input-box:focus {
    border-color: var(--primary);
  }

  .btn {
    padding: 0.6rem 1.15rem;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    transition: all 0.2s;
  }

  .btn-primary {
    background: var(--primary);
    color: #000;
    box-shadow: 0 0 12px var(--primary-glow);
  }

  .btn-outline {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-main);
  }

  .btn-outline:hover {
    background: rgba(255, 255, 255, 0.05);
  }

  .btn-danger-soft {
    border-color: rgba(239, 68, 68, 0.5) !important;
    color: #fca5a5 !important;
  }

  .btn-pill {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 0.55rem 0.9rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
  }

  .action-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 0.35rem 0.75rem;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
  }

  .action-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  .table-container {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(10px);
    border-radius: 14px;
    overflow: hidden;
    width: 100%;
  }

  .table-wrapper {
    overflow-x: auto;
    width: 100%;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
    text-align: left;
  }

  th {
    background: rgba(15, 23, 42, 0.95);
    padding: 0.9rem 1rem;
    font-size: 0.75rem;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
    border-bottom: 1px solid var(--border-color);
    white-space: nowrap;
  }

  td {
    padding: 0.9rem 1rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    white-space: nowrap;
  }

  tr:hover td {
    background: rgba(255, 255, 255, 0.02);
  }

  .mono {
    font-family: 'JetBrains Mono', monospace;
  }

  .badge {
    padding: 0.25rem 0.6rem;
    border-radius: 12px;
    font-size: 0.7rem;
    font-weight: 600;
    display: inline-block;
  }

  .badge-gray { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; }
  .badge-blue { background: rgba(59, 130, 246, 0.15); color: #93c5fd; }
  .badge-cyan { background: rgba(6, 182, 212, 0.15); color: #67e8f9; }
  .badge-purple { background: rgba(168, 85, 247, 0.15); color: #d8b4fe; }
  .badge-amber { background: rgba(245, 158, 11, 0.15); color: #fde68a; }
  .badge-success { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }
  .badge-danger { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }

  .pagination-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border-color);
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .page-controls {
    display: flex;
    gap: 0.5rem;
  }

  .mobile-card-container { display: none; }
  .mobile-pagination { display: none; }
  .mobile-bottom-nav { display: none; }

  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 1rem;
  }

  .modal-overlay.active { display: flex; }

  .modal-card {
    background: #0f172a;
    border: 1px solid var(--border-color);
    border-radius: 16px;
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  }

  .modal-header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-title { font-weight: 700; font-size: 1rem; }
  .modal-close { background: transparent; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; }
  .modal-body { padding: 1.25rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.85rem; }

  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
  .form-label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); }

  .calc-preview {
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 0.85rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    font-size: 0.8rem;
  }

  .calc-row { display: flex; justify-content: space-between; align-items: center; }
  .calc-row.total { border-top: 1px solid var(--border-color); padding-top: 0.4rem; font-weight: 700; color: #fff; }

  .toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: #0f172a;
    border: 1px solid var(--primary);
    color: #fff;
    padding: 0.75rem 1.25rem;
    border-radius: 10px;
    font-size: 0.85rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    display: none;
    z-index: 200;
  }

  .toast.show { display: block; }

  @media (max-width: 850px) {
    body { padding-bottom: 5.5rem; }
    header { padding: 0.75rem 1rem; }
    .header-actions { display: none; }
    .container { padding: 0.75rem; }

    .stats-grid { grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 1rem; }
    .stat-card { padding: 0.85rem; }
    .stat-value { font-size: 1.15rem; }

    .filter-group-top { flex-direction: column; align-items: stretch; gap: 0.5rem; }
    .filter-group-bottom { flex-wrap: wrap; }
    .date-input-wrap { width: 100%; }
    .date-input-wrap input[type="date"] { flex: 1; }

    #desktop-table-container { display: none; }
    
    .mobile-card-container {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .mobile-pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .bphtb-card-mobile {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 0.5rem;
    }

    .card-noreg { font-size: 0.85rem; font-weight: 700; color: var(--primary); }
    .card-date { font-size: 0.75rem; color: var(--text-muted); }
    .card-wp { font-size: 0.95rem; font-weight: 700; color: #fff; }
    .card-nop { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem; }

    .card-finance-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      background: rgba(0, 0, 0, 0.35);
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
    }

    .card-fin-item span { font-size: 0.68rem; color: var(--text-muted); display: block; }
    .card-fin-item b { font-size: 0.82rem; font-family: 'JetBrains Mono', monospace; }

    .card-footer-action {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.2rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .mobile-bottom-nav {
      display: flex;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border-color);
      padding: 0.65rem 1.25rem;
      z-index: 90;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-item.active { color: var(--primary); }
    .form-grid-2 { grid-template-columns: 1fr; }
  }
</style>
